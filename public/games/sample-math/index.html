<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>計算チャレンジ - TRAIL外部ゲームサンプル</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 480px;
      width: 100%;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .subtitle { font-size: 0.875rem; opacity: 0.8; margin-bottom: 2rem; }
    .question-box {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border-radius: 1rem;
      padding: 2rem;
      margin-bottom: 1.5rem;
    }
    .progress { font-size: 0.75rem; opacity: 0.7; margin-bottom: 0.5rem; }
    .expression { font-size: 2.5rem; font-weight: 700; margin: 1rem 0; }
    .timer { font-size: 0.875rem; opacity: 0.8; }
    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .choice-btn {
      background: rgba(255,255,255,0.2);
      border: 2px solid rgba(255,255,255,0.3);
      color: #fff;
      font-size: 1.25rem;
      font-weight: 700;
      padding: 1rem;
      border-radius: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .choice-btn:hover { background: rgba(255,255,255,0.35); transform: scale(1.05); }
    .choice-btn.correct { background: #10b981; border-color: #10b981; }
    .choice-btn.wrong { background: #ef4444; border-color: #ef4444; }
    .choice-btn:disabled { cursor: default; opacity: 0.7; }
    .hidden { display: none; }
    .start-btn {
      background: #fff;
      color: #764ba2;
      border: none;
      font-size: 1.25rem;
      font-weight: 700;
      padding: 1rem 3rem;
      border-radius: 2rem;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .start-btn:hover { transform: scale(1.05); }
  </style>
</head>
<body>
  <div class="container">
    <!-- Intro -->
    <div id="intro">
      <h1>計算チャレンジ</h1>
      <p class="subtitle">制限時間内にたし算・ひき算・かけ算に挑戦！</p>
      <button class="start-btn" onclick="startGame()">スタート</button>
    </div>

    <!-- Game -->
    <div id="game" class="hidden">
      <div class="question-box">
        <p class="progress" id="progress"></p>
        <p class="expression" id="expression"></p>
        <p class="timer" id="timer"></p>
      </div>
      <div class="choices" id="choices"></div>
    </div>
  </div>

  <script src="/trail-sdk.js"></script>
  <script>
    var trail = new TrailSDK();
    var TOTAL = 8;
    var TIME_LIMIT = 10;
    var current = 0;
    var score = 0;
    var details = [];
    var questionStart = 0;
    var timerInterval = null;
    var answer = 0;

    trail.onInit(function (payload) {
      // Can use payload.game_id, payload.user_id etc.
    });

    trail.onReset(function () {
      current = 0;
      score = 0;
      details = [];
      document.getElementById('intro').classList.remove('hidden');
      document.getElementById('game').classList.add('hidden');
    });

    function startGame() {
      current = 0;
      score = 0;
      details = [];
      document.getElementById('intro').classList.add('hidden');
      document.getElementById('game').classList.remove('hidden');
      trail.started();
      nextQuestion();
    }

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateQuestion() {
      var ops = ['+', '-', '×'];
      var op = ops[randInt(0, 2)];
      var a, b, ans;
      if (op === '+') {
        a = randInt(10, 99); b = randInt(10, 99); ans = a + b;
      } else if (op === '-') {
        a = randInt(30, 99); b = randInt(10, a); ans = a - b;
      } else {
        a = randInt(2, 12); b = randInt(2, 12); ans = a * b;
      }
      return { text: a + ' ' + op + ' ' + b + ' = ?', answer: ans };
    }

    function shuffle(arr) {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = randInt(0, i);
        var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      }
      return arr;
    }

    function nextQuestion() {
      if (current >= TOTAL) {
        finishGame();
        return;
      }
      var q = generateQuestion();
      answer = q.answer;
      document.getElementById('progress').textContent = (current + 1) + ' / ' + TOTAL;
      document.getElementById('expression').textContent = q.text;
      trail.progress(current + 1, TOTAL);

      // Generate choices
      var choices = [answer];
      while (choices.length < 4) {
        var fake = answer + randInt(-10, 10);
        if (fake !== answer && choices.indexOf(fake) === -1 && fake >= 0) {
          choices.push(fake);
        }
      }
      choices = shuffle(choices);

      var container = document.getElementById('choices');
      container.innerHTML = '';
      choices.forEach(function (c) {
        var btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = c;
        btn.onclick = function () { selectAnswer(c, btn); };
        container.appendChild(btn);
      });

      // Timer
      questionStart = Date.now();
      var remaining = TIME_LIMIT;
      document.getElementById('timer').textContent = '残り ' + remaining + '秒';
      clearInterval(timerInterval);
      timerInterval = setInterval(function () {
        remaining = Math.max(0, TIME_LIMIT - Math.round((Date.now() - questionStart) / 1000));
        document.getElementById('timer').textContent = '残り ' + remaining + '秒';
        if (remaining <= 0) {
          clearInterval(timerInterval);
          selectAnswer(null, null);
        }
      }, 250);
    }

    function selectAnswer(selected, btn) {
      clearInterval(timerInterval);
      var elapsed = Math.round((Date.now() - questionStart) / 1000);
      var correct = selected === answer;
      if (correct) score++;

      // Visual feedback
      var buttons = document.querySelectorAll('.choice-btn');
      buttons.forEach(function (b) {
        b.disabled = true;
        if (parseInt(b.textContent) === answer) b.classList.add('correct');
        else if (b === btn) b.classList.add('wrong');
      });

      details.push({
        question: '問題' + (current + 1),
        correct: correct,
        time_seconds: elapsed,
      });

      current++;
      setTimeout(nextQuestion, 800);
    }

    function finishGame() {
      document.getElementById('game').classList.add('hidden');
      trail.complete({
        score: score,
        max_score: TOTAL,
        time_seconds: details.reduce(function (s, d) { return s + d.time_seconds; }, 0),
        details: details,
      });
    }
  </script>
</body>
</html>
